---
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--enable=all]

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 03a7d1a4936b5889602852175bca2d39acb3281e  # frozen: v0.3.0
    hooks:
      - id: rumdl-check
        args: [--fix]
      - id: rumdl-fmt

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
    hooks:
      - id: commitizen
